/* =========================================================
   Helpers
   ========================================================= */
function esc(s){ return String(s ?? '').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
function member(name){ return MEMBERS.find(m => m.name === name); }
function listOf(card){ return LISTS.find(l => l.id === card.listId); }
function calcSlaDueAt(priority, createdAt){ return new Date(new Date(createdAt).getTime() + PRIORITY[priority].hours*3600*1000); }
function slaStatus(card){
  const list = listOf(card);
  if (list.isDone) return 'done';
  const due = calcSlaDueAt(card.priority, card.createdAt);
  if (due < NOW) return 'overdue';
  const total = PRIORITY[card.priority].hours*3600*1000;
  const remain = due - NOW;
  if (remain / total < 0.25) return 'at_risk';
  return 'ok';
}
function fmtDT(d){
  d = new Date(d);
  return d.toLocaleString('th-TH', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
}
function fmtD(d){
  d = new Date(d);
  return d.toLocaleDateString('th-TH', { day:'2-digit', month:'2-digit', year:'numeric' });
}
function splitTitles(input){
  const lines = Array.isArray(input) ? input : String(input).split(/\r?\n/);
  return lines.map(s => s.replace(/^\s*(\d+[.)]|[-*•])\s*/, '').trim()).filter(Boolean).slice(0,100);
}
function progressOf(card){
  const total = card.subtasks.length;
  const done = card.subtasks.filter(s => s.isDone).length;
  return { done, total, pct: total ? Math.round(done*100/total) : 0 };
}
function nextCode(){
  const max = CARDS.reduce((m,c)=> Math.max(m, parseInt(c.code.slice(3),10)), 0);
  return 'JC-' + String(max+1).padStart(6,'0');
}
function nextCardId(){ return CARDS.reduce((m,c)=>Math.max(m,c.id),0) + 1; }
function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }
function randomColor(){ return AVATAR_COLORS[Math.floor(Math.random()*AVATAR_COLORS.length)]; }
function findOrCreateMember(name){
  name = String(name||'').trim();
  if (!name) return null;
  let m = member(name);
  if (!m) {
    m = { id: nextMemberId++, name, short: name.slice(0,2), color: randomColor() };
    MEMBERS.push(m);
  }
  return m;
}
function avatarHTML(name, size='w-6 h-6 text-[10px]'){
  const m = member(name);
  if (!m) return '';
  return `<div class="${size} rounded-full flex items-center justify-center text-white font-medium shrink-0" style="background:${m.color}" title="${esc(name)}">${esc(m.short)}</div>`;
}

let wasDragged = false;

/* =========================================================
   Toast
   ========================================================= */
function showToast(message, actionLabel, actionFn){
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'bg-slate-900 text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-3 text-sm animate-[fadeIn_.15s]';
  el.innerHTML = `<span>${esc(message)}</span>` + (actionLabel ? `<button class="text-indigo-300 font-medium hover:text-indigo-200 shrink-0">${esc(actionLabel)}</button>` : '');
  if (actionLabel) {
    el.querySelector('button').onclick = () => { actionFn(); el.remove(); };
  }
  root.appendChild(el);
  setTimeout(()=> el.remove(), 5000);
}

/* =========================================================
   Business logic: toggle subtask + auto-move
   ========================================================= */
function toggleSubtask(cardId, subId){
  const card = CARDS.find(c => c.id === cardId);
  const st = card.subtasks.find(s => s.id === subId);
  const wasFirstDoneBefore = card.subtasks.some(s => s.isDone);
  st.isDone = !st.isDone;
  st.doneBy = st.isDone ? (state.me || 'ไม่ระบุ') : null;
  st.doneAt = st.isDone ? new Date().toISOString() : null;

  const list = listOf(card);
  if (st.isDone && !wasFirstDoneBefore && ['backlog','todo'].includes(list.slug)) {
    card.listId = LISTS.find(l => l.slug === 'doing').id;
    showToast(`"${card.title}" ถูกย้ายไป In Progress อัตโนมัติ`);
  } else {
    const prog = progressOf(card);
    if (st.isDone && prog.done === prog.total && !['review','done'].includes(list.slug)) {
      showToast(`ทำครบทุกขั้นตอนแล้ว ย้ายไป Review เลยไหม?`, 'ย้ายเลย', () => {
        card.listId = LISTS.find(l => l.slug === 'review').id;
        renderMain();
      });
    }
  }
  renderMain();
  if (document.getElementById('modal-root').innerHTML) openCard(cardId);
}

/* =========================================================
   Card / Board rendering
   ========================================================= */
function cardMatchesFilters(card){
  const q = state.query.trim().toLowerCase();
  if (q) {
    const hay = [card.title, card.site, card.deviceRef, card.code, card.creator].filter(Boolean).join(' ').toLowerCase();
    if (!hay.includes(q)) return false;
  }
  if (state.filters.priority && card.priority !== state.filters.priority) return false;
  if (state.filters.type && card.type !== state.filters.type) return false;
  if (state.filters.slaStatus && slaStatus(card) !== state.filters.slaStatus) return false;
  return true;
}

function slaChipHTML(card){
  const s = slaStatus(card);
  if (s === 'overdue') return `<span class="text-rose-600 text-[11px] font-medium flex items-center gap-1">⏰ เกินกำหนด</span>`;
  if (s === 'at_risk') return `<span class="text-orange-500 text-[11px] font-medium flex items-center gap-1">⚠ ใกล้ครบ</span>`;
  return '';
}

function cardHTML(card){
  const t = ICONS[card.type];
  const prog = progressOf(card);
  const bar = prog.pct === 100 ? 'bg-emerald-500' : 'bg-indigo-500';
  return `

function clearFilters(){
  state.filters = { priority:'', type:'', slaStatus:'' };
  state.query = '';
  document.getElementById('searchInput').value = '';
  renderMain();
}

function onCardClick(evt, id){
  if (wasDragged) { wasDragged = false; return; }
  openCard(id);
}

function initBoardSortable(){
  document.querySelectorAll('#main-content .col-body').forEach(el => {
    Sortable.create(el, {
      group: 'board',
      animation: 150,
      forceFallback: true,
      fallbackTolerance: 3,
      onStart: () => { wasDragged = true; },
      onEnd: (evt) => {
        const cardId = Number(evt.item.dataset.cardId);
        const newListId = Number(evt.to.dataset.listId);
        const card = CARDS.find(c => c.id === cardId);
        const oldList = listOf(card).name;
        card.listId = newListId;
        const newList = LISTS.find(l => l.id === newListId);
        renderMain();
        if (oldList !== newList.name) showToast(`ย้าย "${card.title}" ไป ${newList.name} แล้ว`);
        setTimeout(()=> wasDragged = false, 50);
      },
    });
  });
}

   Card modal
   ========================================================= */
function subtaskRowHTML(card, s){
  return `
  <div class="subtask-row flex items-center gap-2 py-1.5 group" data-sub-id="${s.id}">
    <span class="cursor-grab text-slate-300 handle">⠿</span>
    <input type="checkbox" ${s.isDone?'checked':''} onchange="toggleSubtask(${card.id}, ${s.id})" class="w-4 h-4 accent-indigo-600 shrink-0">
    <span class="flex-1 text-sm ${s.isDone?'line-through text-slate-400':''}" ondblclick="editSubtaskTitle(${card.id}, ${s.id}, this)">${esc(s.title)}</span>
    ${s.isDone ? `<span class="text-[11px] text-slate-400 shrink-0">โดย ${esc(s.doneBy)}</span>` : (s.assignee ? `<span class="text-[11px] text-slate-400 shrink-0">${esc(s.assignee)}</span>` : '')}
    <div class="subtask-actions opacity-0 group-hover:opacity-100 flex items-center gap-1 shrink-0">
      <button onclick="deleteSubtask(${card.id}, ${s.id})" class="text-slate-400 hover:text-rose-500 text-xs">🗑</button>
    </div>
  </div>`;
}

function editSubtaskTitle(cardId, subId, el){
  const card = CARDS.find(c=>c.id===cardId);
  const s = card.subtasks.find(x=>x.id===subId);
  const input = document.createElement('input');
  input.value = s.title;
  input.className = 'flex-1 text-sm border border-indigo-300 rounded px-1';
  el.replaceWith(input);
  input.focus();
  const commit = () => { s.title = input.value.trim() || s.title; openCard(cardId); };
  input.onblur = commit;
  input.onkeydown = (e) => { if (e.key==='Enter') input.blur(); };
}

function deleteSubtask(cardId, subId){
  const card = CARDS.find(c=>c.id===cardId);
  card.subtasks = card.subtasks.filter(s=>s.id!==subId);
  renderMain(); openCard(cardId);
}

function addSubtasksFromTextarea(cardId){
  const ta = document.getElementById('newSubtaskInput');
  const titles = splitTitles(ta.value);
  if (!titles.length) return;
  const card = CARDS.find(c=>c.id===cardId);
  titles.forEach(title => card.subtasks.push({ id: subtaskIdSeq++, title, isDone:false, doneBy:null, doneAt:null, assignee:null }));
  ta.value = '';
  renderMain(); openCard(cardId);
}

function applyTemplate(cardId, slug){
  if (!slug) return;
  const card = CARDS.find(c=>c.id===cardId);
  const tpl = TEMPLATES[slug];
  tpl.items.forEach(title => card.subtasks.push({ id: subtaskIdSeq++, title, isDone:false, doneBy:null, doneAt:null, assignee:null }));
  showToast(`เพิ่มขั้นตอนจากแม่แบบ "${tpl.name}" ${tpl.items.length} ข้อ`);
  renderMain(); openCard(cardId);
}

function initSubtaskSortable(cardId){
  const el = document.getElementById('subtaskList');
  if (!el) return;
  Sortable.create(el, {
    handle: '.handle', animation:150,
    forceFallback: true,
    fallbackTolerance: 3,
    onEnd: () => {
      const card = CARDS.find(c=>c.id===cardId);
      const order = [...el.children].map(li => Number(li.dataset.subId));
      card.subtasks.sort((a,b)=> order.indexOf(a.id) - order.indexOf(b.id));
      renderMain();
    },
  });
}

function buildActivities(card){
  const acts = [{ t: card.createdAt, text: `${card.creator} สร้างใบงาน` }];
  card.subtasks.filter(s=>s.isDone).forEach(s => acts.push({ t:s.doneAt, text:`${s.doneBy} ติ๊กเสร็จ "${s.title}"` }));
  card.comments.forEach(c => acts.push({ t:c.createdAt, text:`${c.author} แสดงความคิดเห็น` }));
  return acts.sort((a,b)=> new Date(b.t) - new Date(a.t)).slice(0,5);
}

function toggleAssignee(cardId, name){
  const card = CARDS.find(c=>c.id===cardId);
  const i = card.assignees.indexOf(name);
  if (i>-1) card.assignees.splice(i,1); else card.assignees.push(name);
  renderMain(); openCard(cardId);
}

function addComment(cardId){
  const ta = document.getElementById('newCommentInput');
  const body = ta.value.trim();
  if (!body || !state.me) { if(!state.me) alert('กรุณาเลือก "ฉันคือ" ก่อนแสดงความคิดเห็น'); return; }
  const card = CARDS.find(c=>c.id===cardId);
  card.comments.push({ id: Date.now(), author: state.me, body, createdAt: new Date().toISOString() });
  renderMain(); openCard(cardId);
}

function setPriority(cardId, priority){
  const card = CARDS.find(c=>c.id===cardId);
  card.priority = priority;
  showToast('อัปเดตความสำคัญแล้ว — คำนวณ SLA ใหม่จากเวลาที่แจ้งงานเดิม');
  renderMain(); openCard(cardId);
}

function deleteCard(cardId){
  if (!confirm('ยืนยันลบใบงานนี้? การกระทำนี้ย้อนกลับไม่ได้')) return;
  CARDS = CARDS.filter(c=>c.id!==cardId);
  closeModal(); renderMain();
}

          <div>
            <label class="text-xs font-medium">ความสำคัญ</label>
            <select id="cPriority" onchange="document.getElementById('cSlaHint').innerText='SLA: ภายใน '+({critical:4,high:24,medium:72,low:168})[this.value]+' ชั่วโมง'" class="w-full border border-slate-300 rounded-md text-sm px-2 py-1.5 mt-1">
              ${Object.entries(PRIORITY).map(([k,v])=>`<option value="${k}" ${k==='medium'?'selected':''}>${v.label}</option>`).join('')}
            </select>
            <div id="cSlaHint" class="text-[11px] text-slate-400 mt-0.5">SLA: ภายใน 72 ชั่วโมง</div>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="text-xs font-medium">Site</label><input id="cSite" class="w-full border border-slate-300 rounded-md text-sm px-2 py-1.5 mt-1"></div>
          <div><label class="text-xs font-medium">ลูกค้า</label><input id="cCustomer" class="w-full border border-slate-300 rounded-md text-sm px-2 py-1.5 mt-1"></div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="text-xs font-medium">อุปกรณ์</label><input id="cDevice" class="w-full border border-slate-300 rounded-md text-sm px-2 py-1.5 mt-1"></div>
          <div><label class="text-xs font-medium">กำหนดเสร็จ</label><input id="cDue" type="date" class="w-full border border-slate-300 rounded-md text-sm px-2 py-1.5 mt-1"></div>
        </div>
        <div>
          <label class="text-xs font-medium">เลขโครงการ <span class="text-slate-400 font-normal">(ไม่บังคับ)</span></label>
          <input id="cProjectCode" placeholder="E26-1234" class="w-full border border-slate-300 rounded-md text-sm px-2 py-1.5 mt-1 uppercase" maxlength="8">
          <div class="text-[11px] text-slate-400 mt-0.5">รูปแบบ E + ปี 2 หลัก + "-" + เลข 4 หลัก เช่น E26-1234</div>
        </div>
        <div>
          <label class="text-xs font-medium">ขั้นตอนการทำงาน</label>
          <select id="cTemplate" class="w-full border border-slate-300 rounded-md text-xs px-2 py-1 mt-1 mb-1">
            <option value="">ไม่ใช้แม่แบบ</option>
            ${Object.entries(TEMPLATES).map(([k,v])=>`<option value="${k}">${esc(v.name)} (${v.items.length} ขั้นตอน)</option>`).join('')}
          </select>
          <textarea id="cSubtasks" rows="3" placeholder="1. ทำ backup&#10;2. ติดตั้งเวอร์ชันใหม่&#10;3. ทดสอบ" class="w-full border border-slate-300 rounded-md text-sm px-2 py-1.5"></textarea>
          <div class="text-[11px] text-slate-400 mt-0.5">วางรายการที่มีเลขนำหน้าได้เลย ระบบตัด "1." "-" ให้อัตโนมัติ</div>
        </div>
        <div>
          <label class="text-xs font-medium">ผู้รับผิดชอบ (ไม่เลือก = ผู้สร้าง)</label>
          <div class="flex flex-wrap gap-2 mt-1">
            ${MEMBERS.map(m=>`<label class="text-xs border border-slate-200 rounded-full px-2 py-1 flex items-center gap-1 cursor-pointer hover:bg-slate-50">
              <input type="checkbox" value="${esc(m.name)}" class="c-assignee accent-indigo-600"> ${esc(m.name)}
            </label>`).join('')}
          </div>
        </div>
      </div>
      <div class="flex justify-end gap-2 mt-5">
        <button onclick="closeModal()" class="text-sm px-3 py-1.5 rounded-md border border-slate-300 hover:bg-slate-50">ยกเลิก</button>
        <button onclick="submitCreate(${listId})" class="text-sm px-4 py-1.5 rounded-md bg-indigo-600 text-white hover:bg-indigo-700">สร้างใบงาน</button>
      </div>
    </div>
  </div>`;
}

function addNewMemberInline(selectId){
  const name = prompt('ชื่อสมาชิกใหม่:');
  if (!name || !name.trim()) return;
  const m = findOrCreateMember(name.trim());
  const sel = document.getElementById(selectId);
  if (sel) {
    const opt = document.createElement('option');
    opt.value = m.name; opt.textContent = m.name; opt.selected = true;
    sel.appendChild(opt);
  }
}

function submitCreate(listId){
  const creator = document.getElementById('cCreator').value;
  const title = document.getElementById('cTitle').value.trim();
  if (!creator) { alert('กรุณาเลือกผู้สร้างใบงาน'); return; }
  if (!title) { alert('กรุณากรอกชื่องาน'); return; }

  const projectCode = document.getElementById('cProjectCode').value.trim().toUpperCase();
  if (projectCode && !PROJECT_CODE_RE.test(projectCode)) {
    alert('รูปแบบเลขโครงการไม่ถูกต้อง — ต้องเป็น E + ปี 2 หลัก + "-" + เลข 4 หลัก เช่น E26-1234');
    return;
  }

  const templateSlug = document.getElementById('cTemplate').value;
  const manualTitles = splitTitles(document.getElementById('cSubtasks').value);
  const templateTitles = templateSlug ? TEMPLATES[templateSlug].items : [];
  const allTitles = [...manualTitles, ...templateTitles];

  let assignees = [...document.querySelectorAll('.c-assignee:checked')].map(el => el.value);
  if (!assignees.length) assignees = [creator];

  const card = {
    id: nextCardId(), code: nextCode(), listId,
    title, description: document.getElementById('cDesc').value.trim(),
    type: document.getElementById('cType').value, priority: document.getElementById('cPriority').value,
    site: document.getElementById('cSite').value.trim() || null,
    customer: document.getElementById('cCustomer').value.trim() || null,
    deviceRef: document.getElementById('cDevice').value.trim() || null,
    projectCode: projectCode || null,
    dueDate: document.getElementById('cDue').value || null,
    createdAt: new Date().toISOString(), creator, assignees,
    labels: [], subtasks: allTitles.map(t => ({ id: subtaskIdSeq++, title:t, isDone:false, doneBy:null, doneAt:null, assignee:null })),
    comments: [], attachments: [], timeLogs: [],
  };
  CARDS.push(card);
  closeModal(); renderMain();
  showToast(`สร้างใบงาน ${card.code} เรียบร้อย`);
}

/* =========================================================
   Dashboard
   ========================================================= */
function viewDashboard(){
  const doneListIds = LISTS.filter(l=>l.isDone).map(l=>l.id);
  const open = CARDS.filter(c=>!doneListIds.includes(c.listId)).length;
  const doing = CARDS.filter(c=>listOf(c).slug==='doing').length;
  const overdue = CARDS.filter(c=>slaStatus(c)==='overdue').length;
  const doneThisWeek = CARDS.filter(c=>doneListIds.includes(c.listId)).length;
  const risky = CARDS.filter(c=>['overdue','at_risk'].includes(slaStatus(c)));

  return `
  <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
    ${kpiCard('งานเปิดอยู่', open, 'indigo')}
    ${kpiCard('กำลังดำเนินการ', doing, 'sky')}
    ${kpiCard('เกินกำหนด', overdue, 'rose')}
    ${kpiCard('ปิดแล้ว', doneThisWeek, 'emerald')}
  </div>
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-5">
    <div class="bg-white rounded-xl border border-slate-200 p-4"><div class="text-sm font-medium mb-2">ภาระงานรายคน (ผู้รับผิดชอบ)</div><canvas id="chartWorkload" height="160"></canvas></div>
    <div class="bg-white rounded-xl border border-slate-200 p-4"><div class="text-sm font-medium mb-2">จำนวนใบงานที่แต่ละคนสร้าง</div><canvas id="chartCreator" height="160"></canvas></div>
  </div>
  <div class="bg-white rounded-xl border border-slate-200 overflow-hidden">
    <div class="px-4 py-2 font-medium text-sm border-b border-slate-100">งานเกินกำหนด + ใกล้ครบ</div>
    <table class="w-full text-sm">
      <thead><tr class="text-left text-slate-500 text-xs border-b border-slate-100">
        <th class="px-4 py-2">Code</th><th>งาน</th><th>ผู้สร้าง</th><th>ผู้รับผิดชอบ</th><th>ความคืบหน้า</th><th>กำหนด</th><th>สถานะ</th>
      </tr></thead>
      <tbody>
        ${risky.map(c=>{ const p=progressOf(c); const s=slaStatus(c);
          return `<tr class="border-b border-slate-50 hover:bg-slate-50 cursor-pointer" onclick="openCard(${c.id})">
            <td class="px-4 py-2">${esc(c.code)}</td><td>${esc(c.title)}</td><td>${esc(c.creator)}</td>
            <td>${c.assignees.join(', ')||'—'}</td><td>${p.total?p.done+'/'+p.total:'—'}</td>
            <td>${c.dueDate?fmtD(c.dueDate):'—'}</td>
            <td>${s==='overdue'?'<span class="text-rose-600">เกินกำหนด</span>':'<span class="text-orange-500">ใกล้ครบ</span>'}</td>
          </tr>`; }).join('') || `<tr><td class="px-4 py-3 text-slate-400" colspan="7">ไม่มีงานเกินกำหนดหรือใกล้ครบ 🎉</td></tr>`}
      </tbody>
    </table>
  </div>`;
}
function kpiCard(label, value, color){
  return `<div class="bg-white rounded-xl border border-slate-200 p-4"><div class="text-xs text-slate-500 mb-1">${label}</div><div class="text-2xl font-semibold text-${color}-600">${value}</div></div>`;
}
let chartWorkload, chartCreator;
function initDashboardCharts(){
  const wCtx = document.getElementById('chartWorkload');
  const cCtx = document.getElementById('chartCreator');
  if (!wCtx || !cCtx) return;
  const doneListIds = LISTS.filter(l=>l.isDone).map(l=>l.id);
  const workload = MEMBERS.map(m => CARDS.filter(c=>c.assignees.includes(m.name) && !doneListIds.includes(c.listId)).length);
  const created = MEMBERS.map(m => CARDS.filter(c=>c.creator===m.name).length);
  if (chartWorkload) chartWorkload.destroy();
  if (chartCreator) chartCreator.destroy();
  chartWorkload = new Chart(wCtx, { type:'bar', data:{ labels: MEMBERS.map(m=>m.name), datasets:[{ data: workload, backgroundColor:'#6366f1', borderRadius:4 }] }, options:{ plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true,ticks:{stepSize:1}}} } });
  chartCreator = new Chart(cCtx, { type:'bar', data:{ labels: MEMBERS.map(m=>m.name), datasets:[{ data: created, backgroundColor:'#10b981', borderRadius:4 }] }, options:{ indexAxis:'y', plugins:{legend:{display:false}}, scales:{x:{beginAtZero:true,ticks:{stepSize:1}}} } });
}

/* =========================================================
   My Tasks / Members
   ========================================================= */
function viewMyTasks(){
  if (!state.me) return `<div class="text-sm text-slate-500">กรุณาเลือก "ฉันคือ" ที่แถบด้านบนก่อน เพื่อดูงานของคุณ</div>`;
  const created = CARDS.filter(c=>c.creator===state.me);
  const assigned = CARDS.filter(c=>c.assignees.includes(state.me));
  return `
  <div class="mb-6">
    <div class="font-medium text-sm mb-2">📝 งานที่ฉันสร้าง (${created.length})</div>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-2">${created.map(c=>`<div>${cardHTML(c)}</div>`).join('') || '<div class="text-xs text-slate-400">ไม่มี</div>'}</div>
  </div>
  <div>
    <div class="font-medium text-sm mb-2">✅ งานที่ฉันรับผิดชอบ (${assigned.length})</div>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-2">${assigned.map(c=>`<div>${cardHTML(c)}</div>`).join('') || '<div class="text-xs text-slate-400">ไม่มี</div>'}</div>
  </div>`;
}

function viewMembers(){
  return `
  <div class="bg-white rounded-xl border border-slate-200 overflow-hidden">
    <table class="w-full text-sm">
      <thead><tr class="text-left text-slate-500 text-xs border-b border-slate-100"><th class="px-4 py-2">สมาชิก</th><th>สร้างแล้ว</th><th>งานค้าง</th></tr></thead>
      <tbody>
        ${MEMBERS.map(m=>{
          const createdCount = CARDS.filter(c=>c.creator===m.name).length;
          const doneListIds = LISTS.filter(l=>l.isDone).map(l=>l.id);
          const pendingCount = CARDS.filter(c=>c.assignees.includes(m.name) && !doneListIds.includes(c.listId)).length;
          return `<tr class="border-b border-slate-50">
            <td class="px-4 py-2 flex items-center gap-2">${avatarHTML(m.name,'w-7 h-7 text-xs')}<span>${esc(m.name)}</span></td>
            <td>${createdCount}</td><td>${pendingCount}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>`;
}

/* =========================================================
   Shell / routing
   ========================================================= */
const NAV = [
  { route:'#/board', icon:'📋', label:'Board' },
  { route:'#/dashboard', icon:'📊', label:'Dashboard' },
  { route:'#/mytasks', icon:'✅', label:'My Tasks' },
  { route:'#/members', icon:'👥', label:'Members' },
];

function buildShell(){
  document.getElementById('app').innerHTML = `
  <aside class="w-52 bg-white border-r border-slate-200 flex flex-col shrink-0">
    <div class="px-4 py-4 font-semibold text-indigo-600 text-lg">📋 JobCard Pro</div>
    <nav id="sidebarNav" class="flex-1 px-2 space-y-1"></nav>
  </aside>
  <div class="flex-1 flex flex-col overflow-hidden">
    <header class="bg-white border-b border-slate-200 px-4 py-2.5 flex items-center gap-3">
      <input id="searchInput" placeholder="🔍 ค้นหา (ชื่องาน / site / device / code / ผู้สร้าง)" class="border border-slate-300 rounded-md text-sm px-3 py-1.5 w-72">
      <div class="flex-1"></div>
      <label class="text-xs text-slate-500">ฉันคือ</label>
      <select id="meSelect" class="border border-slate-300 rounded-md text-sm px-2 py-1.5"></select>
      <button onclick="addNewMemberInline('meSelect')" class="text-xs border border-slate-300 rounded-md px-2 py-1.5 hover:bg-slate-50">+ ชื่อใหม่</button>
      <button onclick="openCreateModal()" class="bg-indigo-600 text-white text-sm px-3 py-1.5 rounded-md hover:bg-indigo-700 shrink-0">+ สร้างใบงาน</button>
    </header>
    <main id="main-content" class="flex-1 overflow-auto p-4"></main>
  </div>`;

  document.getElementById('searchInput').oninput = debounce(function(){ state.query = this.value; if(location.hash.startsWith('#/board')||!location.hash) renderMain(); }, 250);

  const meSel = document.getElementById('meSelect');
  meSel.innerHTML = `<option value="">— เลือกชื่อ —</option>` + MEMBERS.map(m=>`<option value="${esc(m.name)}" ${state.me===m.name?'selected':''}>${esc(m.name)}</option>`).join('');
  meSel.onchange = function(){ state.me = this.value; localStorage.setItem('jc_me', state.me); renderMain(); };
}

function renderSidebar(){
  const hash = location.hash || '#/board';
  document.getElementById('sidebarNav').innerHTML = NAV.map(n => `
    <a href="${n.route}" class="nav-link flex items-center gap-2 px-3 py-2 rounded-md text-slate-600 hover:bg-slate-50 text-sm ${hash.startsWith(n.route)?'active':''}">
      <span>${n.icon}</span><span>${n.label}</span>
    </a>`).join('');
}

function renderMain(){
  renderSidebar();
  const hash = location.hash || '#/board';
  const main = document.getElementById('main-content');
  if (hash.startsWith('#/dashboard')) { main.innerHTML = viewDashboard(); initDashboardCharts(); }
  else if (hash.startsWith('#/mytasks')) { main.innerHTML = viewMyTasks(); }
  else if (hash.startsWith('#/members')) { main.innerHTML = viewMembers(); }
  else { main.innerHTML = viewBoard(); initBoardSortable();
    ['fPriority','fType','fSla'].forEach((id,i) => {
      const key = ['priority','type','slaStatus'][i];
      document.getElementById(id).onchange = function(){ state.filters[key] = this.value; renderMain(); };
    });
  }
}

window.addEventListener('hashchange', renderMain);
buildShell();
if (!location.hash) location.hash = '#/board';
renderMain();
</script>
