# Deploy variant for the kuma.cdg.co.th host (Portainer: set "Compose path" to
# this file). The host's nginx runs in the `nginx_proxy` container and proxies
# to other containers by name over the shared `data_network` — it cannot reach
# 127.0.0.1:3000 on the host, so the app joins that network instead.
# Persistent data lives under /data/docker/giskanban like the other apps on
# this host (bind mounts here replace the ./data and ./backups ones from
# docker-compose.yml, matched by container path). Everything else (build,
# env_file, healthcheck) comes from docker-compose.yml.
# See docs/09-deployment.md §4.8.
services:
  app:
    extends:
      file: docker-compose.yml
      service: app
    container_name: giskanban-app
    networks: [data_network]
    volumes:
      - /data/docker/giskanban/data:/app/data
      - /data/docker/giskanban/backups:/backup

networks:
  data_network:
    external: true
